<form [formGroup]="form" class="w-full max-w-4xl mx-auto p-6 space-y-6" (ngSubmit)="onSubmit()">

  <ng-container *ngFor="let field of fields">
    
    <div 
      *ngIf="isFieldVisible(field)" 
      [ngClass]="field.className || 'mb-4'">
      
      <label *ngIf="field.label" class="block text-sm font-semibold text-gray-700 mb-2">
        {{ field.label }}
        <span *ngIf="isFieldRequired(field)" class="text-red-500 ml-1">*</span>
      </label>

      <select
        *ngIf="field.type === 'select'"
        [formControlName]="field.key"
        class="w-full min-h-[42px] px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="hasFieldError(field)">
        <option value="" disabled>{{ field.placeholder || 'Select option' }}</option>
        <option 
          *ngFor="let option of getFieldOptions(field)" 
          [value]="option[field.optionValue || 'value']">
          {{ option[field.optionLabel || 'label'] }}
        </option>
      </select>

      <p-autoComplete
        *ngIf="field.type === 'autocomplete'"
        [suggestions]="getFilteredOptionsForField(field)"
        (completeMethod)="onAutoCompleteSearch($event, field)"
        (onDropdownClick)="onAutocompleteDropdownClick(field)"
        [dropdown]="field.dropdown !== false"
        [minLength]="field.minLength || 0"
        [formControlName]="field.key"
        [placeholder]="field.placeholder"
        [optionLabel]="field.optionLabel || 'label'"
        [optionValue]="field.optionValue || 'value'"
        class="w-full min-h-[42px]"
        [class.border-red-500]="hasFieldError(field)">
      </p-autoComplete>

      <input *ngIf="field.type === 'input'" 
             pInputText 
             [formControlName]="field.key" 
             [placeholder]="field.placeholder"
             class="w-full px-3 py-2"
             [class.border-red-500]="hasFieldError(field)"
             (blur)="onInputBlur(field, $event)"
             (focus)="onInputFocus(field, $event)" />

      <div class="flex items-center gap-2 text-red-600 text-sm mt-1" *ngIf="hasFieldError(field)">
        <i class="pi pi-exclamation-triangle text-xs"></i>
        <span>{{ getFieldErrorMessage(field) }}</span>
      </div>

      <div *ngIf="field.type === 'repeat'" class="border border-gray-200 rounded-lg p-4 bg-gray-50">
        <div class="flex justify-between items-center mb-6">
          <label class="text-lg font-semibold text-gray-700">{{ field.addText || 'Items' }}</label>
          <p-button 
            type="button" 
            icon="pi pi-plus" 
            (onClick)="addItem(field)" 
            *ngIf="isFieldCanAdd(field)">
          </p-button>
        </div>

        <div formArrayName="{{ field.key }}" class="space-y-4">
          <div *ngFor="let grp of getSafeFormArrayControls(field); let i = index" 
               [formGroupName]="i" 
               class="bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200">

            <div class="flex items-center justify-between p-4 border-b border-gray-200 bg-gradient-to-r from-slate-50 to-gray-100 rounded-t-xl">
              <div class="flex items-center gap-4">
                <div class="flex items-center justify-center w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-full font-bold shadow-lg">
                  <span class="text-sm font-bold">{{ i + 1 }}</span>
                </div>
                <h4 class="text-lg font-semibold text-gray-700">{{ field.fieldArray?.title || 'Item' }} #{{ i + 1 }}</h4>
              </div>
              <div>
                <p-button 
                  type="button" 
                  icon="pi pi-trash" 
                  severity="danger" 
                  size="small" 
                  [text]="true"
                  [rounded]="true"
                  class="text-red-500 hover:bg-red-50"
                  (onClick)="removeItem(field, i)"
                  [attr.title]="'Remove ' + (field.fieldArray?.title || 'Item') + ' #' + (i + 1)">
                </p-button>
              </div>
            </div>

            <div class="p-5 space-y-4">
              <ng-container *ngFor="let sub of field.fieldArray?.fieldGroup">

                <div class="space-y-2" *ngIf="isNestedFieldVisible(sub, field, i)">
                  <label *ngIf="sub.label" class="block text-sm font-medium text-gray-700">
                    {{ sub.label }}
                    <span *ngIf="isFieldRequired(sub)" class="text-red-500 ml-1">*</span>
                  </label>

                <p-autoComplete
                  *ngIf="sub.type === 'autocomplete'"
                  [suggestions]="getNestedFilteredOptionsForField(sub, field.key, i)"
                  (completeMethod)="filterNestedOptions($event, sub, field.key, i)"
                  (onDropdownClick)="onNestedAutocompleteDropdownClick(sub, field.key, i)"
                  [dropdown]="sub.dropdown !== false"
                  [minLength]="sub.minLength || 0"
                  [formControlName]="sub.key"
                  [placeholder]="sub.placeholder"
                  [optionLabel]="sub.optionLabel || 'label'"
                  [optionValue]="sub.optionValue || 'value'"
                  class="w-full"
                  [class.border-red-500]="hasNestedFieldError(field, sub, i)">
                </p-autoComplete>

                <select
                  *ngIf="sub.type === 'select'"
                  [formControlName]="sub.key"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                  [class.border-red-500]="hasNestedFieldError(field, sub, i)"
                  (change)="onNestedSelectChange(sub, $event, field.key, i)">
                  <option value="" disabled>{{ sub.placeholder || 'Select option' }}</option>
                  <option 
                    *ngFor="let option of getNestedFieldOptions(sub, field.key, i)" 
                    [value]="option[sub.optionValue || 'value']">
                    {{ option[sub.optionLabel || 'label'] }}
                  </option>
                </select>

                <input *ngIf="sub.type === 'input'" 
                       pInputText 
                       [formControlName]="sub.key" 
                       [placeholder]="sub.placeholder"
                       class="w-full px-3 py-2"
                       [class.border-red-500]="hasNestedFieldError(field, sub, i)" />

                <div class="flex items-center gap-2 text-red-600 text-sm mt-1" *ngIf="hasNestedFieldError(field, sub, i)">
                  <i class="pi pi-exclamation-triangle text-xs"></i>
                  <span>{{ getNestedFieldErrorMessage(field, sub, i) }}</span>
                </div>
              </div>

              </ng-container>
            </div>
          </div>
        </div>
      </div>

    </div>

  </ng-container>

  <div class="flex justify-end mt-8 pt-6 border-t border-gray-200" *ngIf="showSubmitButton">
    <button 
      type="submit" 
      class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition-colors">
      {{ submitLabel }}
    </button>
  </div>
</form>
