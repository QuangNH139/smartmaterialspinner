<p-card [style]="{'margin-bottom': '1rem'}" styleClass="machine-card">
  
  <ng-template pTemplate="header">
    <div class="flex items-center justify-between p-4 bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-gray-100">
      <div class="flex items-center space-x-3">
        <div class="flex items-center justify-center w-10 h-10 bg-blue-100 rounded-full">
          <i class="pi pi-cog text-blue-600 text-xl"></i>
        </div>
        
        <div>
          <h3 class="text-lg font-semibold text-gray-800 m-0">
            {{ title || 'Machine' }} - {{ machineNumber }}
          </h3>
          <p class="text-sm text-gray-500 m-0 mt-1">Configuration and settings</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button 
          *ngIf="collapsible"
          type="button"
          pButton
          class="p-button-text p-button-sm p-button-rounded"
          [icon]="collapsed ? 'pi pi-chevron-down' : 'pi pi-chevron-up'"
          (click)="onToggle()">
        </button>

        <button 
          *ngIf="showRemoveButton && removable"
          type="button"
          pButton
          class="p-button-text p-button-sm p-button-rounded p-button-danger"
          icon="pi pi-trash"
          (click)="onRemove()">
        </button>
      </div>
    </div>
  </ng-template>

  <div [class.hidden]="collapsed" class="space-y-4">
    <ng-content></ng-content>
    
    <ng-container *ngIf="cardContent">
      <ng-container [ngTemplateOutlet]="cardContent"></ng-container>
    </ng-container>
  </div>

  <ng-template pTemplate="footer">
    <div [class.hidden]="collapsed" class="pt-3 border-t border-gray-100">
      <ng-content select="[slot=footer]"></ng-content>
    </div>
  </ng-template>

</p-card>
