<div class="space-y-4 repeat-section">
  <div *ngFor="let item of items; let i = index" class="machine-enter">
    <ng-content select="[item-content]"></ng-content>
  </div>

  <div class="flex justify-center pt-4 add-button-container">
    <button
      type="button"
      pButton
      [disabled]="!canAdd || (items?.length ?? 0) >= max"
      (click)="add.emit()"
      class="p-button p-button-success p-button-raised"
      [style]="{'padding': '0.75rem 1.5rem', 'font-size': '1rem'}">
      
      <i class="pi pi-plus mr-2"></i>
      {{ addText || 'Add New Machine' }}
    </button>
  </div>

  <div *ngIf="items.length === 0" class="text-center py-12 empty-state">
    <div class="mx-auto flex items-center justify-center h-24 w-24 rounded-full bg-gray-100 mb-4">
      <i class="pi pi-cog text-gray-400 text-4xl"></i>
    </div>
    <h3 class="text-lg font-medium text-gray-900 mb-2">No machines configured</h3>
    <p class="text-gray-500 mb-6">Get started by adding your first machine configuration.</p>
  </div>
</div>
