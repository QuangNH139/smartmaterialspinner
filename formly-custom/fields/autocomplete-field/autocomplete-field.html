<p-autoComplete
  [(ngModel)]="value"
  [suggestions]="suggestions"
  (completeMethod)="onComplete($event)"
  [placeholder]="placeholder"
  [dropdown]="dropdown"
  [minLength]="minLength"
  [optionLabel]="field"
  (onSelect)="valueChange.emit($event)"
  style="width: 100%">

  <ng-template let-item pTemplate="item">
    <div class="auto-item">
      <i class="pi pi-search mr-2 text-gray-400"></i>
      {{ item.label }}
    </div>
  </ng-template>

  <ng-template pTemplate="loading">
    <div *ngIf="loading" class="p-2 text-center text-gray-400">
      <i class="pi pi-spin pi-spinner mr-1"></i> Đang tải...
    </div>
  </ng-template>
</p-autoComplete>
